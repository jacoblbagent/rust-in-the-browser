name: Deploy to GitHub Pages

# The site is plain static files under www/, and the compiled module is
# committed at www/pkg. Nothing is rebuilt here: the job stages www/ and hands
# it to Pages. Rebuilding would mean putting the wasm toolchain in CI for no
# gain, and the page reports the compiler version and build time the module was
# actually built with.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r www/. _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
